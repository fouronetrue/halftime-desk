name: tests
# Runs on every push, and is called by worker release (release.yml) before it moves the worker branch, so a
# commit that fails here never reaches Railway.
on: [push, workflow_dispatch, workflow_call]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - run: python tests/parity.py
      - run: python tests/readonly.py
      - run: python tests/trade_guard.py
      - run: python tests/mirror.py
      - run: python tests/worker.py
      - run: python tests/held.py
      - run: python tests/fixes.py
      - run: python tests/nba.py
      - run: python tests/grading.py
      - run: python tests/reverse.py
      - run: python tests/flickers.py
      - run: python tests/football.py
      - run: python tests/odds.py
      - run: python tests/push.py
      - run: python tests/export.py
      - run: python tests/venues.py
      - run: python tests/bankroll.py
      - run: python tests/release.py
      - run: python tests/weather.py
      - run: python tests/shot.py
      - run: python tests/breaks.py
      - run: cp state.json /tmp/state.bak && python watch.py --fixtures tests/fixtures && cp /tmp/state.bak state.json
