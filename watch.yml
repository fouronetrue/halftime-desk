name: halftime watch
# Runs every 5 minutes inside the football windows (UTC). Each run exits in seconds unless a game is
# approaching or at the half, in which case it keeps polling for up to max_poll_minutes (config.json).
on:
  schedule:
    - cron: '*/5 23 * * 4'        # Thu 23:00-23:59 UTC (7pm ET kicks: TNF, Thursday college)
    - cron: '*/5 0-3 * * 5'       # Fri 00:00-03:59 UTC
    - cron: '*/5 23 * * 5'        # Fri 23:00-23:59 UTC (Friday college)
    - cron: '*/5 0-3 * * 6'       # Sat 00:00-03:59 UTC
    - cron: '*/5 15-23 * * 6'     # Sat 15:00-23:59 UTC (college Saturday)
    - cron: '*/5 0-4 * * 0'       # Sun 00:00-04:59 UTC (late Saturday games)
    - cron: '*/5 16-23 * * 0'     # Sun 16:00-23:59 UTC (NFL Sunday)
    - cron: '*/5 0-4 * * 1'       # Mon 00:00-04:59 UTC (SNF)
    - cron: '*/5 23 * * 1'        # Mon 23:00-23:59 UTC (MNF pregame)
    - cron: '*/5 0-4 * * 2'       # Tue 00:00-04:59 UTC (MNF)
  workflow_dispatch:
concurrency:
  group: halftime-watch
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: Watch
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: python watch.py
      - name: Save state and log
        run: |
          git config user.name "halftime-desk bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase --autostash -q || true
          git add state.json log/
          git diff --cached --quiet || (git commit -q -m "state $(date -u +%FT%TZ)" && git push -q)
